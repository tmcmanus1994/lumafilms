name: SEO agent — weekly pull + digest

# Monday 12:00 UTC (~6–7am Central). Also runnable on demand from the
# Actions tab. Skips gracefully until the secrets are configured.
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check secrets
        id: gate
        run: |
          if [ -z "${{ secrets.SEO_AGENT_KEY_JSON }}" ] || [ -z "${{ secrets.GA4_PROPERTY_ID }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SEO agent secrets not set yet (SEO_AGENT_KEY_JSON, GA4_PROPERTY_ID) — skipping. See seo-agent/README.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull data
        if: steps.gate.outputs.configured == 'true'
        env:
          KEY_JSON: ${{ secrets.SEO_AGENT_KEY_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: |
          echo "$KEY_JSON" > /tmp/seo-agent-key.json
          SEO_AGENT_KEY_FILE=/tmp/seo-agent-key.json node seo-agent/pull.mjs

      - name: Generate digest
        if: steps.gate.outputs.configured == 'true'
        run: node seo-agent/digest.mjs

      - name: Commit data + report
        if: steps.gate.outputs.configured == 'true'
        run: |
          git config user.name "luma-seo-agent"
          git config user.email "seo-agent@lumaweddingfilms.co"
          git add seo-data/
          git diff --cached --quiet || git commit -m "SEO agent: weekly pull + digest $(date -u +%F)"
          git push
